<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Booking.com - Список Готелів</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    
    <style>
        body { font-family: 'Poppins', sans-serif; background-color: #f5f5f5; }
        .navbar { background-color: #003580; padding: 15px 0; }
        .navbar-brand { color: white !important; font-weight: 600; font-size: 1.5rem; }
        .card { border: none; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        .btn-booking { background-color: #0071c2; color: white; font-weight: 600; border-radius: 8px; }
        .btn-booking:hover { background-color: #005999; color: white; }
        .text-warning { color: #feba02 !important; }
        .table th { border-bottom-width: 1px; color: #666; font-weight: 600; text-transform: uppercase; font-size: 0.85rem; }
        .table td { vertical-align: middle; }
        .action-btn { border-radius: 6px; padding: 5px 10px; }
    </style>
</head>
<body>
    <nav class="navbar mb-5">
        <div class="container">
            <a class="navbar-brand" href="#"><i class="fa-solid fa-bed me-2"></i>Booking.com</a>
        </div>
    </nav>

    <div class="container pb-5">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2 class="h3 mb-0 text-dark fw-bold">Список Готелів</h2>
            <div class="d-flex gap-2">
            <a href="{{ url_for('export_data', format_type='json') }}" class="btn btn-outline-secondary px-3 py-2">
                <i class="fa-solid fa-file-code me-2"></i>JSON
            </a>
            <a href="{{ url_for('export_data', format_type='xml') }}" class="btn btn-outline-secondary px-3 py-2">
                <i class="fa-solid fa-file-excel me-2"></i>XML
            </a>
            <a href="{{ url_for('add_hotel') }}" class="btn btn-booking px-4 py-2 ms-2">
                <i class="fa-solid fa-plus me-2"></i>Додати готель
            </a>
        </div>
    </div>
        <div class="card p-4">
            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                    <thead>
                        <tr>
                            <th>Назва готелю</th>
                            <th>Рейтинг</th>
                            <th>Країна</th>
                            <th>Місто</th>
                            <th class="text-end">Дії</th>
                        </tr>
                    </thead>
                    <tbody>
                        {% for hotel in hotels %}
                        <tr>
                            <td class="fw-bold text-dark">{{ hotel.name }}</td>
                            <td>
                                {% for i in range(hotel.starRating) %}
                                    <i class="fa-solid fa-star text-warning"></i>
                                {% endfor %}
                            </td>
                            <td><i class="fa-solid fa-globe text-muted me-2"></i>{{ hotel.location.country }}</td>
                            <td><i class="fa-solid fa-city text-muted me-2"></i>{{ hotel.location.city }}</td>
                            <td class="text-end">
                                <a href="{{ url_for('edit_hotel', hotel_id=hotel.hotelId) }}" class="btn btn-outline-primary btn-sm action-btn me-2" title="Редагувати">
                                    <i class="fa-solid fa-pen"></i>
                                </a>
                                <a href="{{ url_for('delete_hotel', hotel_id=hotel.hotelId) }}" class="btn btn-outline-danger btn-sm action-btn" title="Видалити" onclick="return confirm('Ви точно хочете видалити цей готель?');">
                                    <i class="fa-solid fa-trash"></i>
                                </a>
                            </td>
                        </tr>
                        {% endfor %}
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</body>
</html>
