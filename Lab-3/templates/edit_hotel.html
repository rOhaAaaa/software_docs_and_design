<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Редагувати Готель - Booking.com</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    
    <style>
        body { font-family: 'Poppins', sans-serif; background-color: #f5f5f5; }
        .navbar { background-color: #003580; padding: 15px 0; }
        .navbar-brand { color: white !important; font-weight: 600; font-size: 1.5rem; }
        .card { border: none; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); }
        .form-control { border-radius: 8px; padding: 10px 15px; }
        .form-control:focus { border-color: #feba02; box-shadow: 0 0 0 0.25rem rgba(254, 186, 2, 0.25); }
        .btn-edit { background-color: #feba02; color: #333; font-weight: 600; border-radius: 8px; padding: 10px; border: none; }
        .btn-edit:hover { background-color: #e5a700; color: #111; }
    </style>
</head>
<body>
    <nav class="navbar mb-5">
        <div class="container">
            <a class="navbar-brand" href="{{ url_for('index') }}"><i class="fa-solid fa-bed me-2"></i>Booking.com</a>
        </div>
    </nav>

    <div class="container pb-5">
        <div class="row justify-content-center">
            <div class="col-md-6 col-lg-5">
                <div class="card p-5">
                    <h3 class="mb-4 text-center fw-bold"><i class="fa-solid fa-pen text-warning me-2"></i>Редагувати</h3>
                    
                    <form method="POST" action="{{ url_for('edit_hotel', hotel_id=hotel.hotelId) }}">
                        <div class="mb-3">
                            <label class="form-label text-muted fw-bold small">НАЗВА ГОТЕЛЮ</label>
                            <input type="text" class="form-control" name="name" value="{{ hotel.name }}" required>
                        </div>
                        
                        <div class="mb-3">
                            <label class="form-label text-muted fw-bold small">РЕЙТИНГ (1-5)</label>
                            <input type="number" class="form-control" name="star_rating" min="1" max="5" value="{{ hotel.starRating }}" required>
                        </div>
                        
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label text-muted fw-bold small">КРАЇНА</label>
                                <input type="text" class="form-control" name="country" value="{{ hotel.location.country }}" required>
                            </div>
                            <div class="col-md-6 mb-4">
                                <label class="form-label text-muted fw-bold small">МІСТО</label>
                                <input type="text" class="form-control" name="city" value="{{ hotel.location.city }}" required>
                            </div>
                        </div>

                        <div class="d-grid gap-2">
                            <button type="submit" class="btn btn-edit"><i class="fa-solid fa-save me-2"></i>Оновити дані</button>
                            <a href="{{ url_for('index') }}" class="btn btn-light border">Скасувати</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
